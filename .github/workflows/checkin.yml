name: 平安打卡
run-name: 手动只查询验证（不提交打卡）
on:
  workflow_dispatch:
    inputs:
      verify_login:
        description: '验证云端重新登录（不提交打卡）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: csu-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线测试
        run: python -m unittest discover -v
      - name: 手动只查询验证
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKIN_AUTH_JSON: ${{ secrets.CHECKIN_AUTH_JSON }}
          CHECKIN_VERIFY_LOGIN: ${{ inputs.verify_login && 'true' || 'false' }}
        run: python cloud_runner.py --dry-run
