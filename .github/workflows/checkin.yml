name: 平安打卡
run-name: ${{ github.event_name == 'schedule' && '每日平安打卡' || '手动验证与邮件测试（不提交打卡）' }}
on:
  schedule:
    - cron: '13 12 * * *'
    - cron: '43 12 * * *'
    - cron: '13 13 * * *'
    - cron: '43 13 * * *'
  workflow_dispatch:
    inputs:
      verify_login:
        description: '验证云端重新登录（不提交打卡）'
        type: boolean
        default: true
      notify_email:
        description: '发送一封邮件测试通知（不提交打卡）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: csu-checkin
  cancel-in-progress: false
jobs:
  checkin:
    if: github.event_name == 'workflow_dispatch' || vars.CHECKIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线测试
        run: python -m unittest discover -v
      - name: 手动只查询验证
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKIN_AUTH_JSON: ${{ secrets.CHECKIN_AUTH_JSON }}
          CHECKIN_VERIFY_LOGIN: ${{ inputs.verify_login && 'true' || 'false' }}
        run: python cloud_runner.py --dry-run
      - name: 每日随机打卡
        if: github.event_name == 'schedule'
        env:
          CHECKIN_AUTH_JSON: ${{ secrets.CHECKIN_AUTH_JSON }}
        run: python cloud_runner.py --scheduled
      - name: 邮件通知
        if: always() && (github.event_name == 'schedule' || inputs.notify_email)
        env:
          SMTP_USERNAME: ${{ secrets.MAIL_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          CHECKIN_JOB_STATUS: ${{ job.status }}
        run: python mail_notify.py
